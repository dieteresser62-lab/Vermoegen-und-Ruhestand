<svg width="1000" height="290" data-source-sha256="b3b3b5179be1e20fa65661c5fde9c008ec3a5ba78d6751843b0d92f263a062b2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc"><title id="title">Spielbereich und Rückkehr</title><desc id="desc">Beispiele und Datumssprünge erlauben nur Verwerfen; eine Kopie ohne Datumssprung kann bei unverändertem echtem Bestand übernommen werden. Pfeile zeigen den nächsten Schritt.</desc><rect width="1000" height="290" fill="#f1f2ee"/><g font-family="Arial, sans-serif" text-anchor="middle" fill="#1d2830"><text x="500" y="32" font-size="24">Spielbereich und Rückkehr</text><rect x="20.0" y="60" width="306.6666666666667" height="75" rx="8" fill="#ffffff" stroke="#7a5a1f"/><text x="173.33333333333334" y="99" font-size="17">Eigener Bestand</text><rect x="346.6666666666667" y="60" width="306.6666666666667" height="75" rx="8" fill="#ffffff" stroke="#7a5a1f"/><text x="500.0" y="99" font-size="17">Kopie oder Beispiel</text><rect x="673.3333333333334" y="60" width="306.6666666666667" height="75" rx="8" fill="#ffffff" stroke="#7a5a1f"/><text x="826.6666666666667" y="99" font-size="17">Im Spielbereich ändern</text><rect x="673.3333333333334" y="170" width="306.6666666666667" height="75" rx="8" fill="#ffffff" stroke="#7a5a1f"/><text x="826.6666666666667" y="209" font-size="17">Beenden und prüfen</text><rect x="346.6666666666667" y="170" width="306.6666666666667" height="75" rx="8" fill="#ffffff" stroke="#7a5a1f"/><text x="500.0" y="209" font-size="17">Verwerfen oder Kopie übernehmen</text><rect x="20.0" y="170" width="306.6666666666667" height="75" rx="8" fill="#f2e9d4" stroke="#7a5a1f"/><text x="173.33333333333334" y="209" font-size="17">Zurück zum eigenen Bestand</text><path d="M326.6666666666667,97 H346.6666666666667" fill="none" stroke="#7a5a1f" stroke-width="2"/><path d="M339.6666666666667,91 L346.6666666666667,97 L339.6666666666667,103 Z" fill="#7a5a1f"/><path d="M653.3333333333334,97 H673.3333333333334" fill="none" stroke="#7a5a1f" stroke-width="2"/><path d="M666.3333333333334,91 L673.3333333333334,97 L666.3333333333334,103 Z" fill="#7a5a1f"/><path d="M826.6666666666667,135 V170" fill="none" stroke="#7a5a1f" stroke-width="2"/><path d="M820.6666666666667,163 L826.6666666666667,170 L832.6666666666667,163 Z" fill="#7a5a1f"/><path d="M673.3333333333334,207 H653.3333333333334" fill="none" stroke="#7a5a1f" stroke-width="2"/><path d="M660.3333333333334,201 L653.3333333333334,207 L660.3333333333334,213 Z" fill="#7a5a1f"/><path d="M346.6666666666667,207 H326.6666666666667" fill="none" stroke="#7a5a1f" stroke-width="2"/><path d="M333.6666666666667,201 L326.6666666666667,207 L333.6666666666667,213 Z" fill="#7a5a1f"/></g></svg>
