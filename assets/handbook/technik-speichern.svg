<svg width="1100" height="620" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc" data-source-sha256="f4dd78c1d4fc3f06cfd9f5e0b5d8553a82ce38e12465e1c7f80bec83cf0eb176"><title id="title">Speichern, Schließen und Import</title><desc id="desc">Ein Dienst sperrt Fortsetzungen, flusht offene Writes und bestätigt Speichern durch Rücklesen. Import braucht vorher einen bestätigten Archivpunkt. Erst danach darf das Dokument schließen oder neu laden.</desc><rect width="1100" height="620" fill="#f1f2ee"/><text x="550" y="35" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#1d2830">Speichern, Schließen und Import</text><rect x="30" y="65" width="230" height="48" rx="6" fill="#ffffff" stroke="#7a5a1f"/><path d="M145,113 V555" stroke="#bcc3c1" stroke-dasharray="5 5"/><text x="145" y="95" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#1d2830">Seite/Fenster</text><rect x="305" y="65" width="230" height="48" rx="6" fill="#ffffff" stroke="#7a5a1f"/><path d="M420,113 V555" stroke="#bcc3c1" stroke-dasharray="5 5"/><text x="420" y="95" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#1d2830">Dienst und Guard</text><rect x="580" y="65" width="230" height="48" rx="6" fill="#ffffff" stroke="#7a5a1f"/><path d="M695,113 V555" stroke="#bcc3c1" stroke-dasharray="5 5"/><text x="695" y="95" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#1d2830">Bestand</text><rect x="855" y="65" width="230" height="48" rx="6" fill="#ffffff" stroke="#7a5a1f"/><path d="M970,113 V555" stroke="#bcc3c1" stroke-dasharray="5 5"/><text x="970" y="95" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#1d2830">Archiv</text><rect x="294" y="268" width="786" height="232" rx="5" fill="none" stroke="#7a5a1f"/><text x="310" y="297" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#1d2830">Optionaler Import nach Vorschau und Bestätigung</text><path d="M145,150 L420,150" stroke="#7a5a1f" stroke-width="2" fill="none"/><path d="M420,150 L411.0,146.0 L411.0,154.0 Z" fill="#7a5a1f"/><text x="282.5" y="138" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1d2830">Speichern oder Schließen</text><path d="M420,200 L695,200" stroke="#7a5a1f" stroke-width="2" fill="none"/><path d="M695,200 L686.0,196.0 L686.0,204.0 Z" fill="#7a5a1f"/><text x="557.5" y="188" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1d2830">Offene Writes flushen</text><path d="M695,245 L420,245" stroke="#7a5a1f" stroke-width="2" fill="none"/><path d="M420,245 L429.0,249.0 L429.0,241.0 Z" fill="#7a5a1f"/><text x="557.5" y="233" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1d2830">Backendbestätigung</text><path d="M420,335 L970,335" stroke="#7a5a1f" stroke-width="2" fill="none"/><path d="M970,335 L961.0,331.0 L961.0,339.0 Z" fill="#7a5a1f"/><text x="695.0" y="323" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1d2830">Vorabpunkt schreiben und zurücklesen</text><path d="M970,380 L420,380" stroke="#7a5a1f" stroke-width="2" fill="none"/><path d="M420,380 L429.0,384.0 L429.0,376.0 Z" fill="#7a5a1f"/><text x="695.0" y="368" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1d2830">Punkt bestätigt</text><path d="M420,430 L695,430" stroke="#7a5a1f" stroke-width="2" fill="none"/><path d="M695,430 L686.0,426.0 L686.0,434.0 Z" fill="#7a5a1f"/><text x="557.5" y="418" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1d2830">Ausgang prüfen, Records ersetzen</text><path d="M695,475 L420,475" stroke="#7a5a1f" stroke-width="2" fill="none"/><path d="M420,475 L429.0,479.0 L429.0,471.0 Z" fill="#7a5a1f"/><text x="557.5" y="463" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1d2830">Rücklesen und fachlich prüfen</text><path d="M420,540 L145,540" stroke="#7a5a1f" stroke-width="2" fill="none"/><path d="M145,540 L154.0,544.0 L154.0,536.0 Z" fill="#7a5a1f"/><text x="282.5" y="528" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1d2830">Schließen/Reload freigeben</text><text x="550" y="595" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1d2830">Pfeile: Auftrag/Antwort · Bestand und Archiv: getrennte Speichergrenzen</text></svg>
