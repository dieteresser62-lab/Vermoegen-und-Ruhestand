<text x="560.0" y="930" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1d2830"><tspan x="560.0" dy="0">Messing: Entscheidung · Pfeile: Prüf- und Geldfolge · Beleg ist keine reale Ausführung</tspan></text>
