<text x="280.0" y="794.0" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1d2830"><tspan x="280.0" dy="0">Netto für Liquidität</tspan><tspan x="280.0" dy="26">und Käufe</tspan></text>
