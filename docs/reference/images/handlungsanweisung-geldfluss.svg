<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="960" viewBox="0 0 1120 960" role="img" aria-labelledby="title desc" data-source-sha256="61787c02ea789e59b970b0bce753d5fae060e42197c218ac1b97d683fdf1888f">
<title id="title">Von der Geldlücke zur Verwendung</title>
<desc id="desc">Entnahme und freie Bestände bestimmen Ziel und Schutz. Bei zulässigem Verkaufsauftrag folgen Quellenwahl, Steuer und Nettoverwendung. Ohne Verkauf werden Überschussanlage oder Warten geprüft. Der Jahresbeleg hält die Empfehlung fest; er ist noch keine reale Ausführung.</desc>
<rect width="1120" height="960" rx="12" fill="#f1f2ee"/>
<text x="560.0" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#1d2830"><tspan x="560.0" dy="0">Von der Geldlücke zur Verwendung</tspan></text>
<rect x="100" y="80" width="360" height="80" rx="10" fill="#fff" stroke="#d8dbd3" stroke-width="2"/>
<text x="280.0" y="127.0" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1d2830"><tspan x="280.0" dy="0">Entnahme und freie Bestände</tspan></text>
<rect x="100" y="210" width="360" height="80" rx="10" fill="#fff" stroke="#d8dbd3" stroke-width="2"/>
<text x="280.0" y="257.0" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1d2830"><tspan x="280.0" dy="0">Liquiditätsziel und Schutz</tspan></text>
<rect x="100" y="340" width="360" height="90" rx="10" fill="#f2e9d4" stroke="#b8954f" stroke-width="2"/>
<text x="280.0" y="379.0" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1d2830"><tspan x="280.0" dy="0">Verkaufsauftrag</tspan><tspan x="280.0" dy="26">zulässig?</tspan></text>
<rect x="100" y="490" width="360" height="85" rx="10" fill="#fff" stroke="#d8dbd3" stroke-width="2"/>
<text x="280.0" y="526.5" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1d2830"><tspan x="280.0" dy="0">Quellen nach Strategie</tspan><tspan x="280.0" dy="26">und Eigentümer</tspan></text>
<rect x="100" y="630" width="360" height="80" rx="10" fill="#fff" stroke="#d8dbd3" stroke-width="2"/>
<text x="280.0" y="677.0" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1d2830"><tspan x="280.0" dy="0">Brutto abzüglich Steuer</tspan></text>
