<text x="830.0" y="526.5" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1d2830"><tspan x="830.0" dy="0">Überschuss anlegen</tspan><tspan x="830.0" dy="26">oder warten</tspan></text>
