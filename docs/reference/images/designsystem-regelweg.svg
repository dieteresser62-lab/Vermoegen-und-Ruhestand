<svg xmlns="http://www.w3.org/2000/svg" width="480" height="570" viewBox="0 0 480 570" role="img" aria-labelledby="title desc" data-source-sha256="59c3d1d884e72fbf37ffb96e64972b873941a9f5bea53b982af3f7eb7ae982a6">
<title id="title">Von der Gestaltungsregel zur geprüften Ansicht</title>
<desc id="desc">Gestaltungsgrundsätze führen zu Tokens und Bausteinen, dann zu Seiten und Renderern und schließlich zur Sichtprüfung und EXE-Abnahme.</desc>
<rect width="480" height="570" rx="12" fill="#f1f2ee"/>
<text x="240" y="37" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#1d2830"><tspan x="240" dy="0">Von der Gestaltungsregel zur</tspan><tspan x="240" dy="29.7">geprüften Ansicht</tspan></text>
<rect x="80" y="106" width="320" height="80" rx="10" fill="#ffffff" stroke="#d8dbd3" stroke-width="2"/>
<text x="240.0" y="153.0" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1d2830"><tspan x="240.0" dy="0">Gestaltungsgrundsätze</tspan></text>
<rect x="80" y="226" width="320" height="80" rx="10" fill="#ffffff" stroke="#d8dbd3" stroke-width="2"/>
<text x="240.0" y="273.0" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1d2830"><tspan x="240.0" dy="0">Tokens und Bausteine</tspan></text>
<rect x="80" y="346" width="320" height="80" rx="10" fill="#ffffff" stroke="#d8dbd3" stroke-width="2"/>
<text x="240.0" y="393.0" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1d2830"><tspan x="240.0" dy="0">Seiten und Renderer</tspan></text>
<rect x="80" y="466" width="320" height="80" rx="10" fill="#ffffff" stroke="#d8dbd3" stroke-width="2"/>
<text x="240.0" y="499.5" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1d2830"><tspan x="240.0" dy="0">Sichtprüfung und</tspan><tspan x="240.0" dy="27">EXE-Abnahme</tspan></text>
<polyline points="240,186 240,226" fill="none" stroke="#7a5a1f" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="240,226 244,216 236,216" fill="#7a5a1f"/>
<polyline points="240,306 240,346" fill="none" stroke="#7a5a1f" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="240,346 244,336 236,336" fill="#7a5a1f"/>
<polyline points="240,426 240,466" fill="none" stroke="#7a5a1f" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="240,466 244,456 236,456" fill="#7a5a1f"/>
</svg>
