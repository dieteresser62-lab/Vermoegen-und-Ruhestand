<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" aria-labelledby="title desc" data-source-sha256="67f047447bf726a9fea8d42f9815abc6801f7272411851d6fbe244c3decd8396">
<title id="title">Was das Laufende bedeutet</title>
<desc id="desc">Ein Monte-Carlo-Lauf endet durch Tod aller Personen, Horizont, aufgebrauchtes Vermögen oder technischen Fehler. Tod und Horizont zählen als gedeckt bis Laufende, wenn das Vermögen vorher nicht aufgebraucht war. Ein technischer Fehler sperrt die Gesamtquote.</desc>
<rect width="680" height="430" rx="12" fill="#f1f2ee"/>
<text x="340" y="36" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#1d2830"><tspan x="340" dy="0">Was das Laufende bedeutet</tspan></text>
<rect x="210" y="70" width="260" height="72" rx="10" fill="#ffffff" stroke="#d8dbd3" stroke-width="2"/>
<text x="340.0" y="100.14999999999999" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1d2830"><tspan x="340.0" dy="0">Ende eines</tspan><tspan x="340.0" dy="24.3">Monte-Carlo-Laufs</tspan></text>
<rect x="20" y="200" width="124" height="72" rx="10" fill="#ffffff" stroke="#d8dbd3" stroke-width="2"/>
<text x="82.0" y="230.15" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1d2830"><tspan x="82.0" dy="0">Alle</tspan><tspan x="82.0" dy="24.3">verstorben</tspan></text>
<rect x="164" y="200" width="132" height="72" rx="10" fill="#ffffff" stroke="#d8dbd3" stroke-width="2"/>
<text x="230.0" y="230.15" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1d2830"><tspan x="230.0" dy="0">Horizont</tspan><tspan x="230.0" dy="24.3">erreicht</tspan></text>
<rect x="316" y="200" width="160" height="72" rx="10" fill="#ffffff" stroke="#d8dbd3" stroke-width="2"/>
<text x="396.0" y="230.15" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#9c3b33"><tspan x="396.0" dy="0">Vermögen</tspan><tspan x="396.0" dy="24.3">aufgebraucht</tspan></text>
<rect x="496" y="200" width="164" height="72" rx="10" fill="#ffffff" stroke="#d8dbd3" stroke-width="2"/>
<text x="578.0" y="230.15" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1d2830"><tspan x="578.0" dy="0">Technischer</tspan><tspan x="578.0" dy="24.3">Fehler</tspan></text>
<rect x="18" y="330" width="276" height="72" rx="10" fill="#ffffff" stroke="#d8dbd3" stroke-width="2"/>
<text x="156.0" y="360.15000000000003" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#7a5a1f"><tspan x="156.0" dy="0">Vermögen reicht</tspan><tspan x="156.0" dy="24.3">bis Laufende</tspan></text>
<rect x="490" y="330" width="176" height="72" rx="10" fill="#ffffff" stroke="#d8dbd3" stroke-width="2"/>
<text x="578.0" y="360.15000000000003" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1d2830"><tspan x="578.0" dy="0">Gesamtquote</tspan><tspan x="578.0" dy="24.3">nicht auswertbar</tspan></text>
