<text x="560" y="725" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1d2830"><tspan x="560" dy="0">Pfeile: Übergänge · Gradwechsel und Ausfall sind getrennte Ereignisse · zu Hause ist kein Heim</tspan></text>
