<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc" data-source-sha256="2ea5ecb2584e1617f088526e510f690e980dcfd5d75f026de94cd37b948bc128">
<title id="title">Pflegegrad und Pflegeform getrennt lesen</title>
<desc id="desc">Ein heutiger oder neu gezogener Pflegegrad bestimmt die Kostenstufe. Die heutige Pflegeform gilt bis zum Gradwechsel, danach die Staffel. Angehörigenpflege in Grad 1 bis 3 wechselt beim Ausfall des Partners dauerhaft zu externer Unterstützung zu Hause; das ist kein Heimwechsel.</desc>
