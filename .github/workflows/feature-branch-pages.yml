name: Deploy zu GitHub Pages

on:
  push:
    branches: ["main"]          # Baut automatisch bei jedem Push auf main
  workflow_dispatch:           # Erlaubt auch manuelles Starten per Klick

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # Wichtig: Volle Historie für sync-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sauberen dist-Ordner bauen (nur 15 MB)
        run: node scripts/sync-dist.mjs

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"          # Nur die 15 MB Web-Dateien, KEIN .git

      - name: Auf GitHub Pages ausrollen
        id: deployment
        uses: actions/deploy-pages@v4
