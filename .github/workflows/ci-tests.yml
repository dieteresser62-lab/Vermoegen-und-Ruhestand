name: CI - Tests

on:
  # Nur von Hand: Die Tests laufen lokal in jeder Prüfkette; die GitHub-Stände
  # enthalten docs/internal nicht und wären hier immer rot.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Commit-bound Slice 14-16 evidence reads predecessor blobs by SHA.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: .coverage/summary.json
