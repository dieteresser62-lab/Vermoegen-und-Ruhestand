[package]
name = "vermoegen_und_ruhestand"
version = "0.1.0"
description = "Vermögen & Ruhestand"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# SD-1: tauri bleibt auf 2.9; sonst zieht das Dialog-Plugin beim Auflösen tauri 2.10+ samt nicht passender Laufzeit nach.
tauri = { version = "~2.9.4", features = [] }
tauri-plugin-log = "2"
# SD-1: Windows-Dialog „Speichern unter“; 2.6 ist die letzte Fassung für tauri 2.9.
tauri-plugin-dialog = "~2.6"
tiny_http = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

urlencoding = "2.1"
